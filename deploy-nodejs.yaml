apiVersion: v1
kind: ConfigMap
metadata:
  name: nodejs-dev-env
  namespace: nodejs
data:
  company_code: "company_code"
  company_name: "company_name"
---
apiVersion: v1
kind: Service
metadata:
  name: nodejs-dev
  namespace: nodejs
  labels:
    app: nodejs-dev
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: nodejs-dev
---
apiVersion: apps/v1 #  for k8s versions before 1.9.0 use apps/v1beta2  and before 1.8.0 use extensions/v1beta1
kind: Deployment
metadata:
  name: nodejs-dev
  namespace: nodejs
spec:
  selector:
    matchLabels:
      app: nodejs-dev
  replicas: 1
  template:
    metadata:
      labels:
        app: nodejs-dev
    spec:
      containers:
      - name: nodejs-dev
        image: andikapri/nodejs:<version>
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: nodejs-dev-env
      imagePullSecrets:
      - name: registry-secret